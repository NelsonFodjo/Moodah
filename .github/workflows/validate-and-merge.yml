name: Validate and auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'data/manifest.json'
  workflow_dispatch:
    inputs:
      username:
        description: 'Manifest username to (re)generate a mood/description for'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill-mood:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AI mood and description
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_API_URL: ${{ secrets.GROQ_API_URL }}
          TARGET_USERNAME: ${{ inputs.username }}
        run: node scripts/analyze-mood.js

      - name: Commit generated mood output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/mood-results.json
          if git diff --cached --quiet; then
            echo "No generated mood update needed."
            exit 0
          fi
          git commit -m "Generate mood for ${{ inputs.username }} (manual backfill)"
          git push origin HEAD:main

  validate:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base manifest and validate PR
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/$BASE_REF:data/manifest.json" > /tmp/base-manifest.json
          cp data/manifest.json /tmp/head-manifest.json
          node scripts/validate.js /tmp/base-manifest.json /tmp/head-manifest.json "$PR_AUTHOR"

      - name: Auto-merge pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --merge --delete-branch

      - name: Wait for merge to complete
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            state=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q .state)
            if [ "$state" = "MERGED" ]; then
              echo "PR merged."
              exit 0
            fi
            sleep 2
          done
          echo "PR did not merge within timeout" >&2
          exit 1

      - name: Check out main
        if: success()
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate AI mood and description
        if: success()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_API_URL: ${{ secrets.GROQ_API_URL }}
          TARGET_USERNAME: ${{ github.event.pull_request.user.login }}
        run: node scripts/analyze-mood.js

      - name: Commit generated mood output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/mood-results.json
          if git diff --cached --quiet; then
            echo "No generated mood update needed."
            exit 0
          fi
          git commit -m "Generate mood for merged PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main
