name: Validate and auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - 'data/manifest.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base manifest and validate PR
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/$BASE_REF:data/manifest.json" > /tmp/base-manifest.json
          cp data/manifest.json /tmp/head-manifest.json
          node scripts/validate.js /tmp/base-manifest.json /tmp/head-manifest.json

      - name: Auto-merge pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --merge --delete-branch

  generate-mood:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AI mood and description
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_API_URL: ${{ secrets.GROQ_API_URL }}
        run: node scripts/analyze-mood.js

      - name: Commit generated mood output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/mood-results.json
          if git diff --cached --quiet; then
            echo "No generated mood update needed."
            exit 0
          fi
          git commit -m "Generate mood for merged PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main
